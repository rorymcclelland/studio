name: After production deploy

# F-15 and F-17: after a push to main, wait until Vercel serves that commit in
# production, then make the app register its Inngest functions (PUT
# /api/inngest asks the serve handler to sync itself) and check the health
# endpoint lists them. Vercel doesn't send this repo GitHub deployment events,
# so the job polls the health endpoint for the new commit instead.

permissions: {}

on:
  push:
    branches: [main]

concurrency:
  group: after-deploy
  cancel-in-progress: true

jobs:
  sync-inngest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: https://campaign-studio-neon.vercel.app
      COMMIT: ${{ github.sha }}
    steps:
      - name: Wait for production to serve this commit (up to 15 minutes)
        run: |
          want="${COMMIT:0:7}"
          end=$((SECONDS + 900))
          while [ "$SECONDS" -lt "$end" ]; do
            got=$(curl -s --max-time 20 "$APP_URL/api/health" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).commit||"")}catch{console.log("")}})')
            if [ "$got" = "$want" ]; then echo "Production is serving $want"; exit 0; fi
            echo "Waiting: production serves '${got:-unknown}', want $want"
            sleep 15
          done
          echo "Production did not serve $want within 15 minutes. Check the Vercel deployment."; exit 1
      - name: Ask the app to sync its functions with Inngest
        # Three tries, 60 s each: the first call can reach a function still starting
        # cold (27 Oct: one failed and its rerun passed).
        run: |
          for try in 1 2 3; do
            code=$(curl -s --max-time 60 -o sync.json -w '%{http_code}' -X PUT "$APP_URL/api/inngest")
            cat sync.json; echo
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then exit 0; fi
            echo "Try $try: Inngest sync answered HTTP $code"; sleep 15
          done
          echo "Inngest sync failed three times. Resync by hand (docs/hosting.md)."; exit 1
      - name: Check the health endpoint lists the agent run function
        run: |
          curl -sf --max-time 20 "$APP_URL/api/health" -o health.json
          cat health.json; echo
          node -e 'const h=require("./health.json"); if(!h.ok||!(h.inngestFunctions||[]).some(f=>f.endsWith("agent-run"))){console.error("health check: agent-run not served");process.exit(1)}'
