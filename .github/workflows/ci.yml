name: CI

on:
  push:
    # The browser-test results branches (decision 0021) are data, not code.
    branches-ignore: ["e2e-results/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit and database tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: No secrets in the repo
        run: node scripts/check-secrets.mjs --all
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit and database tests (plain Postgres, built from db/migrations)
        # The JSON results go to the demo page with the browser tests' (decision 0021).
        run: npm test -- --reporter=default --reporter=json --outputFile.json=vitest-results.json
      - name: Keep the unit and database test results for the demo page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: vitest-results.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Agent evals against the mock model (checks the runner and graders, costs nothing)
        run: npm run eval -- --mock
      - run: npm audit --omit=dev --audit-level=high
      - run: npx next build

  e2e:
    name: End-to-end (app, Inngest dev server, mock model)
    runs-on: ubuntu-latest
    needs: checks
    # Only to push the results branch below (decision 0021); checkout needs read.
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:54329/campaign_studio_dev
      ALLOWED_EMAILS: dev@example.test
      MODEL_PROVIDER_OVERRIDE: mock
      INNGEST_DEV: "1"
      # The mock model costs nothing real; the whole e2e run shares one day's cap,
      # and with 2K pictures (C7-1) its Make creative runs pass £1 before market.spec.
      DAILY_CAP_PENCE: "1000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/db-reset.mjs --seed
      - run: npx next build
      - name: Start the app and the Inngest dev server
        run: |
          npx next start -p 3000 > app.log 2>&1 &
          npx inngest-cli dev -u http://localhost:3000/api/inngest --no-discovery > inngest.log 2>&1 &
          npx wait-on -t 60000 http://localhost:3000/api/health http://localhost:8288
      # Records every test (CI=true) and writes playwright-report/results.json beside the dot reporter.
      - run: npx playwright test
      # Decision 0021: the results, the recordings of the tests tagged with a case, and the first
      # job's unit-test results go to the branch e2e-results/ci/<branch>, replaced on every run,
      # for the demo page Rory signs the sprint off from (scripts/demo-page.mjs). A branch,
      # because a cloud session can't download Actions artefacts. Pushes only: a pull request's
      # run is the same commit as its branch's push.
      - name: Get the unit and database test results from the first job
        if: ${{ !cancelled() && github.event_name == 'push' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: vitest-results
          path: vitest-results
      - name: Gather the results and recordings for the demo page
        if: ${{ !cancelled() && github.event_name == 'push' }}
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: node scripts/e2e-results.mjs --report playwright-report/results.json --vitest vitest-results/vitest-results.json --out "$RUNNER_TEMP/e2e-results"
      - name: Push them to e2e-results/ci/<branch> as one orphan commit
        if: ${{ !cancelled() && github.event_name == 'push' }}
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A commit with no parent, made from the results folder through a separate index, so
          # the checkout is untouched; the push uses the checkout's token (contents: write).
          export GIT_DIR="$GITHUB_WORKSPACE/.git" GIT_WORK_TREE="$RUNNER_TEMP/e2e-results" GIT_INDEX_FILE="$RUNNER_TEMP/e2e-results.index"
          cd "$GIT_WORK_TREE"
          git add --all
          tree=$(git write-tree)
          commit=$(GIT_AUTHOR_NAME="Studio CI" GIT_AUTHOR_EMAIL="ci@example.test" GIT_COMMITTER_NAME="Studio CI" GIT_COMMITTER_EMAIL="ci@example.test" \
            git commit-tree "$tree" -m "Browser-test results: run $GITHUB_RUN_ID, $SOURCE_BRANCH at ${GITHUB_SHA::7}")
          git push --force origin "$commit:refs/heads/e2e-results/ci/$SOURCE_BRANCH"
          echo "Results on e2e-results/ci/$SOURCE_BRANCH ($(du -sh . | cut -f1))"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            app.log
            inngest.log
            test-results/

  real-stack:
    name: Migrations and database tests on a Neon branch
    runs-on: ubuntu-latest
    needs: checks
    # Required: a failure here fails CI. One run at a time, to stay well inside the
    # free plan's 10 branches; a waiting run starts when the previous one ends.
    concurrency:
      group: neon-ci-branch
      cancel-in-progress: false
    env:
      NEON_PROJECT_ID: misty-moon-16212068
      CI_BRANCH: ci-run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check the Neon API key is set
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          if [ -z "$NEON_API_KEY" ]; then
            echo "::error title=NEON_API_KEY is missing::Add the Neon API key as the repository secret NEON_API_KEY (Settings, Secrets and variables, Actions). This job makes a throwaway Neon branch and can't run without it."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Neon deletes the branch itself after two hours if the delete step below never runs.
      - name: Work out when the branch expires
        id: expiry
        run: echo "at=$(date -u -d '+2 hours' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Make a throwaway branch from the empty ci branch
        id: branch
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b # v6.4.0
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: ci
          branch_name: ${{ env.CI_BRANCH }}
          database: studio
          role: studio_owner
          expires_at: ${{ steps.expiry.outputs.at }}
      # The branch action doesn't mask its connection-string outputs, and a step's env is
      # printed in the log, so the string is fetched here and masked before anything prints.
      - name: Get the branch's connection string (masked)
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          BRANCH_ID: ${{ steps.branch.outputs.branch_id }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H "Authorization: Bearer $NEON_API_KEY" -H "Accept: application/json" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/connection_uri?branch_id=$BRANCH_ID&database_name=studio&role_name=studio_owner&pooled=false" \
            > "$RUNNER_TEMP/uri.json"
          node -e '
            const fs = require("node:fs");
            const u = new URL(JSON.parse(fs.readFileSync(process.argv[1], "utf8")).uri);
            u.searchParams.delete("channel_binding");
            console.log(`::add-mask::${u.toString()}`);
            console.log(`::add-mask::${u.password}`);
            console.log(`::add-mask::${decodeURIComponent(u.password)}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `NEON_CI_URL=${u.toString()}\n`);
          ' "$RUNNER_TEMP/uri.json"
          rm -f "$RUNNER_TEMP/uri.json"
      - name: Apply every migration with the runner
        run: node scripts/db-migrate.mjs --url NEON_CI_URL
      - name: Database, auth and model tests on Neon (Postgres 17, as the non-superuser owner)
        env:
          SKIP_DB_RESET: "1"
        # The runner is in the US and the branch in London, so every query crosses the
        # Atlantic. The database, auth and model tests check what differs on Neon (Postgres 17,
        # row-level security, grants and triggers as the owner role, and the sign-in
        # functions' grants and limits) and pass in about the
        # time allowed. The agent tests make hundreds of queries each and test the same
        # SQL; they run on plain Postgres in the first job (first Neon run, 28 Oct: every
        # database and model test passed, two agent files timed out). The migration-runner,
        # eval-runner and copy tests make their own databases and roles, and the dropped-connection
        # tests put a TCP relay in front of the database (Neon needs the endpoint's name, which a
        # relay hides), so they also run
        # in the first job.
        timeout-minutes: 45
        run: TEST_DATABASE_URL="$NEON_CI_URL" npx vitest run tests/db tests/auth tests/models --testTimeout=60000 --hookTimeout=60000 --exclude tests/db/migrate.test.ts --exclude tests/db/copy-data.test.ts --exclude tests/db/dropped-connection.test.ts
      - name: Delete the throwaway branch (also after a failure)
        if: always() && steps.branch.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: ${{ steps.branch.outputs.branch_id }}
