name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit and database tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: No secrets in the repo
        run: node scripts/check-secrets.mjs --all
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit and database tests (plain Postgres, built from db/migrations)
        run: npm test
      - name: Agent evals against the mock model (checks the runner and graders, costs nothing)
        run: npm run eval -- --mock
      - run: npm audit --omit=dev --audit-level=high
      - run: npx next build

  e2e:
    name: End-to-end (app, Inngest dev server, mock model)
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:54329/campaign_studio_dev
      AUTH_MODE: dev
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef
      ALLOWED_EMAILS: dev@example.test
      MODEL_PROVIDER_OVERRIDE: mock
      INNGEST_DEV: "1"
      DAILY_CAP_PENCE: "100"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/db-reset.mjs --seed
      - run: npx next build
      - name: Start the app and the Inngest dev server
        run: |
          npx next start -p 3000 > app.log 2>&1 &
          npx inngest-cli dev -u http://localhost:3000/api/inngest --no-discovery > inngest.log 2>&1 &
          npx wait-on -t 60000 http://localhost:3000/api/health http://localhost:8288
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            app.log
            inngest.log
            test-results/

  real-stack:
    name: Migrations and database tests on the real Supabase stack
    runs-on: ubuntu-latest
    needs: checks
    # Required since its first green run (27 Oct 2026): a failure here fails CI.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Until N-4 moves this job to a Neon branch: the stack starts empty (the
      # migrations now live in db/migrations, which the Supabase CLI doesn't read)
      # and the runner applies them, leaving Supabase's own auth objects alone.
      - name: Start Supabase and apply migrations with the runner
        env:
          SUPABASE_STACK_URL: postgres://postgres:postgres@localhost:54322/postgres
        run: |
          [ -f supabase/config.toml ] || supabase init
          supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor
          node scripts/db-migrate.mjs --url SUPABASE_STACK_URL
      - name: Database tests against the real stack
        env:
          SKIP_DB_RESET: "1"
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:54322/postgres
        # The eval-runner test builds its own throwaway database on the local
        # Postgres the other jobs use (port 54329), which this job doesn't have;
        # it runs in the first job instead. So does the migration runner's test,
        # which makes and drops its own databases and roles on that Postgres.
        run: npx vitest run tests/db tests/agents tests/models --exclude tests/agents/eval-runner.test.ts --exclude tests/db/migrate.test.ts
