# Copy production data (N-6): Supabase production into Neon, once, for the
# cutover. Run it by hand from Actions; it is removed in N-7, with the
# SUPABASE_DB_URL secret. Runbook: docs/hosting.md, "Cutover".
#
#   target: rehearsal   copies into a fresh Neon branch, rehearsal-<run id>, made
#                       from the empty `ci` branch and migrated here. The branch is
#                       kept for inspection and deletes itself after about two days.
#                       The database and model tests then run on a second, throwaway
#                       branch, copied and checked the same way (Neon can't branch
#                       from a branch with an expiry date), so the rehearsal itself
#                       is left as copied.
#   target: production  copies into the Neon production branch (NEON_DB_URL), which
#                       must be fully migrated and empty, or the copy refuses.
#   target: check       copies nothing: only runs check-copy.mjs, Supabase against
#                       the Neon production branch (NEON_DB_URL). Run it right after
#                       the switch (runbook step 3.7) to prove nothing was written to
#                       Supabase between the copy and the switch: a later write shows
#                       as a difference naming its table.
#
# Connection strings never appear in the log: SUPABASE_DB_URL and NEON_DB_URL are
# environment secrets (masked by GitHub), their passwords are masked as well, and
# the rehearsal branch's string is fetched from the Neon API and masked before
# any step could print it. (The branch action's own db_url output is not masked,
# and GitHub prints each step's env, so it is not used.) No Postgres client is
# installed: the scripts use the `postgres` package from npm ci.
name: Copy production data (one-off, N-6)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to copy to
        type: choice
        options: [rehearsal, production, check]
        required: true
      confirm:
        description: Type the target's name again (rehearsal, production or check) to confirm
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: copy-production-data
  cancel-in-progress: false

jobs:
  copy:
    name: ${{ inputs.target == 'check' && 'Check Neon production against Supabase' || format('Copy into {0}', inputs.target) }}
    runs-on: ubuntu-latest
    environment: cutover
    timeout-minutes: 75
    env:
      NEON_PROJECT_ID: misty-moon-16212068
      TARGET: ${{ inputs.target }}
    steps:
      - name: Check the confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "$TARGET" ]; then
            echo "::error title=Not confirmed::Type the target's name ($TARGET) in the confirm box to run this."
            exit 1
          fi

      - name: Check the secrets are set, and mask their passwords
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          need="SUPABASE_DB_URL"
          if [ "$TARGET" = "rehearsal" ]; then need="$need NEON_API_KEY"; else need="$need NEON_DB_URL"; fi
          for name in $need; do
            if [ -z "${!name}" ]; then
              echo "::error title=$name is missing::Add $name as a secret of the cutover environment (Settings, Environments, cutover). See docs/hosting.md, Cutover."
              exit 1
            fi
          done
          node -e '
            for (const name of ["SUPABASE_DB_URL", "NEON_DB_URL"]) {
              const v = process.env[name];
              if (!v) continue;
              try {
                const u = new URL(v);
                for (const p of [u.password, decodeURIComponent(u.password)]) if (p) console.log(`::add-mask::${p}`);
              } catch { console.log(`::error::${name} is not a valid connection string`); process.exit(1); }
            }'

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Rehearsal: a fresh branch from the empty ci branch, with every migration.
      - name: Work out when the rehearsal branch expires (about two days)
        if: inputs.target == 'rehearsal'
        id: expiry
        run: |
          echo "at=$(date -u -d '+2 days' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "suite_at=$(date -u -d '+2 hours' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Make the rehearsal branch from the empty ci branch
        if: inputs.target == 'rehearsal'
        id: branch
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b # v6.4.0
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: ci
          branch_name: rehearsal-${{ github.run_id }}
          database: studio
          role: studio_owner
          expires_at: ${{ steps.expiry.outputs.at }}
      - name: Use the rehearsal branch as the target (connection string masked)
        if: inputs.target == 'rehearsal'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          BRANCH_ID: ${{ steps.branch.outputs.branch_id }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H "Authorization: Bearer $NEON_API_KEY" -H "Accept: application/json" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/connection_uri?branch_id=$BRANCH_ID&database_name=studio&role_name=studio_owner&pooled=false" \
            > "$RUNNER_TEMP/uri.json"
          node -e '
            const fs = require("node:fs");
            const u = new URL(JSON.parse(fs.readFileSync(process.argv[1], "utf8")).uri);
            u.searchParams.delete("channel_binding");
            console.log(`::add-mask::${u.toString()}`);
            console.log(`::add-mask::${u.password}`);
            console.log(`::add-mask::${decodeURIComponent(u.password)}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `TARGET_DB_URL=${u.toString()}\n`);
          ' "$RUNNER_TEMP/uri.json"
          rm -f "$RUNNER_TEMP/uri.json"
      - name: Apply every migration to the rehearsal branch
        if: inputs.target == 'rehearsal'
        run: node scripts/db-migrate.mjs --url TARGET_DB_URL

      - name: Use the Neon production branch as the target
        if: inputs.target == 'production' || inputs.target == 'check'
        env:
          NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
        run: echo "TARGET_DB_URL=$NEON_DB_URL" >> "$GITHUB_ENV"

      - name: Copy the data
        if: inputs.target != 'check'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/copy-data.mjs --from SUPABASE_DB_URL --to TARGET_DB_URL

      - name: Check the copy against Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/check-copy.mjs --a SUPABASE_DB_URL --b TARGET_DB_URL

      # Rehearsal only (N-6 test case 1): the database tests on data copied from production.
      # They empty tables as they go, so they get their own copy: Neon can't branch from a
      # branch that has an expiry date (the rehearsal's), so a second branch is made from the
      # empty ci branch, migrated, copied into and checked the same way, tested and deleted.
      - name: Make a throwaway branch for the test suite
        if: inputs.target == 'rehearsal'
        id: suite
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b # v6.4.0
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: ci
          branch_name: rehearsal-${{ github.run_id }}-suite
          database: studio
          role: studio_owner
          expires_at: ${{ steps.expiry.outputs.suite_at }}
      - name: Get the suite branch's connection string (masked)
        if: inputs.target == 'rehearsal'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          BRANCH_ID: ${{ steps.suite.outputs.branch_id }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H "Authorization: Bearer $NEON_API_KEY" -H "Accept: application/json" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/connection_uri?branch_id=$BRANCH_ID&database_name=studio&role_name=studio_owner&pooled=false" \
            > "$RUNNER_TEMP/uri.json"
          node -e '
            const fs = require("node:fs");
            const u = new URL(JSON.parse(fs.readFileSync(process.argv[1], "utf8")).uri);
            u.searchParams.delete("channel_binding");
            console.log(`::add-mask::${u.toString()}`);
            console.log(`::add-mask::${u.password}`);
            console.log(`::add-mask::${decodeURIComponent(u.password)}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `SUITE_DB_URL=${u.toString()}\n`);
          ' "$RUNNER_TEMP/uri.json"
          rm -f "$RUNNER_TEMP/uri.json"
      - name: Prepare the suite's branch
        if: inputs.target == 'rehearsal'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          node scripts/db-migrate.mjs --url SUITE_DB_URL
          node scripts/copy-data.mjs --from SUPABASE_DB_URL --to SUITE_DB_URL
          node scripts/check-copy.mjs --a SUPABASE_DB_URL --b SUITE_DB_URL
      # Same scope as CI's Neon job: the runner is in the US and the branch in London, so
      # the agent tests (hundreds of queries each) time out; they run on plain Postgres in CI.
      - name: Database and model tests on the copied data
        if: inputs.target == 'rehearsal'
        timeout-minutes: 45
        env:
          SKIP_DB_RESET: "1"
        run: |
          TEST_DATABASE_URL="$SUITE_DB_URL" npx vitest run tests/db tests/models --testTimeout=60000 \
            --exclude tests/db/migrate.test.ts --exclude tests/db/copy-data.test.ts
      - name: Delete the suite's branch (the rehearsal branch stays)
        if: always() && steps.suite.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: ${{ steps.suite.outputs.branch_id }}

      - name: Summary
        if: always()
        env:
          BRANCH_ID: ${{ steps.branch.outputs.branch_id }}
        run: |
          {
            echo "### Copy production data: $TARGET"
            if [ "$TARGET" = "rehearsal" ] && [ -n "$BRANCH_ID" ]; then
              echo "Rehearsal branch: \`rehearsal-${{ github.run_id }}\` (id \`$BRANCH_ID\`), kept for inspection; it deletes itself after about two days."
            fi
            if [ "$TARGET" = "check" ]; then
              echo "Nothing was copied: the Check step compares Supabase with Neon production as they stand."
            else
              echo "See the Copy and Check steps for per-table row counts and the comparison."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
